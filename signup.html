<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 - 만능레시피</title>
  <link rel="stylesheet" href="css/signup.css" />
</head>

<body>
  <header class="topbar">
    <a href="master_recipe.html" class="brand-wrap">
      <img src="assets/logo.png" alt="만능레시피 로고" class="logo" />
      <h1 class="brand">만능레시피</h1>
    </a>
  </header>

  <main class="container">
    <!-- ⭐ PHP로 제출하기 위한 form -->
    <form class="signup-form" action="signup.php" method="POST">

      <label class="label" for="name">이름</label>
      <input id="name" name="name" type="text" class="input-lg" placeholder="이름을 입력하세요" required />

      <label class="label" for="email">이메일</label>
      <input id="email" name="email" type="email" class="input-lg" placeholder="이메일을 입력하세요" required />

      <label class="label" for="id">아이디</label>
      <input id="id" name="id" type="text" class="input-lg" placeholder="아이디를 입력하세요" required />

      <label class="label" for="pw">비밀번호</label>
      <input id="pw" name="pw" type="password" class="input-lg" placeholder="비밀번호를 입력하세요" required />

      <label class="label" for="pw2">비밀번호 재확인</label>
      <input id="pw2" name="pw2" type="password" class="input-lg" placeholder="비밀번호를 다시 입력하세요" required />

      <div class="cta">
        <button type="submit" class="btn-join">회원가입</button>
      </div>
    </form>
  </main>
</body>
</html>
